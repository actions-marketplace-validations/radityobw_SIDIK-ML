name: SIDIK-ML CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIDIK-ML
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SIDIK >=1.3.3 and SIDIK-ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/radityobw/SIDIK.git@v1.3.3"
          pip install -e ".[dev]"

      - name: Run Unit and Contract Tests
        run: |
          pytest tests -v

      - name: Verify Plugin Discovery and CLI Entrypoints
        run: |
          sidik --list-plugins
          sidik-ml --version
          python -m sidik_ml --version
          sidik-ml --help
          sidik-ml-gui --help

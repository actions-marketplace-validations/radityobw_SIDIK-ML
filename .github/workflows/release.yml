name: Release & Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag (e.g., v0.5.5) to attach wheel/tarball/SHA256SUMS and tag GHCR image"
        required: false
        default: ""
        type: string
      publish_pypi:
        description: "Publish dist artifacts to PyPI via Trusted Publishing OIDC"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-release-assets:
    name: Test, Build Wheel/Sdist & Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SIDIK >=1.3.4, Test & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sidik>=1.3.4,<2.0.0" || pip install "git+https://github.com/radityobw/SIDIK.git@v1.3.6"
          pip install -e ".[dev]" "build>=1.0.0" "twine>=5.0.0"

      - name: Run Unit & Contract Tests
        run: |
          pytest tests -v

      - name: Build Wheel & Sdist and Verify Packaging
        run: |
          python -m build
          python -m twine check dist/*
          python -c "import zipfile, glob; whl=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(whl).namelist(); assert 'sidik_ml/__main__.py' in names and 'sidik_ml/plugin.py' in names and 'sidik_ml/py.typed' in names, names"
          cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidik-ml-dist
          path: dist/

      - name: Attach Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="${EVENT_TAG:-$DISPATCH_TAG}"
          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          else
            echo "No release_tag specified on workflow_dispatch; skipping gh release upload."
          fi

  publish-ghcr:
    name: Build & Push Container to ghcr.io
    needs: build-and-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tags
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          SHA_VAL: ${{ github.sha }}
        run: |
          RAW_TAG="${EVENT_TAG:-$DISPATCH_TAG}"
          SHORT_SHA="${SHA_VAL:0:7}"
          TAGS="ghcr.io/radityobw/sidik-ml:latest,ghcr.io/radityobw/sidik-ml:sha-${SHORT_SHA}"
          if [ -n "$RAW_TAG" ]; then
            CLEAN_VER="${RAW_TAG#v}"
            TAGS="${TAGS},ghcr.io/radityobw/sidik-ml:${CLEAN_VER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SIDIK_CORE_REF=v1.3.6
          labels: |
            org.opencontainers.image.source=https://github.com/radityobw/SIDIK-ML
            org.opencontainers.image.authors=Radityo Budi Waskito
            org.opencontainers.image.licenses=MIT

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: build-and-release-assets
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' && vars.ENABLE_PYPI_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true) }}
    environment:
      name: pypi
      url: https://pypi.org/p/sidik-ml
    permissions:
      id-token: write

    steps:
      - name: Download Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: sidik-ml-dist
          path: dist/

      - name: Strip Non-PyPI Checksum File
        run: rm -f dist/SHA256SUMS.txt

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

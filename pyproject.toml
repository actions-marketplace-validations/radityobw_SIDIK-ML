[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidik-ml"
dynamic = ["version"]
description = "SIDIK-ML: Explainable Non-Neural ML Extension for SIDIK Polyglot SAST & Multi-Ecosystem SCA"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Radityo Budi Waskito"},
]
keywords = ["security", "sast", "sca", "polyglot", "osv", "secret-detection", "machine-learning", "explainable-ai", "non-neural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "sidik>=1.3.4,<2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "skops>=0.9.0",
]

[project.optional-dependencies]
gui = [
    "sidik[gui]>=1.3.4,<2.0.0",
]
train = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
]
explain = [
    "shap>=0.45.0",
]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
sidik-ml = "sidik_ml.cli:main"
sidik-ml-gui = "sidik_ml.cli:launch_gui"

[project.entry-points."sidik.plugins"]
sidik-ml = "sidik_ml.plugin:create_plugin"

[project.entry-points."sidik.brand_assets"]
ml = "sidik_ml.assets"

[project.urls]
Homepage = "https://github.com/radityobw/SIDIK-ML"
Documentation = "https://radityobw.github.io/SIDIK-ML/"
Repository = "https://github.com/radityobw/SIDIK-ML"
Issues = "https://github.com/radityobw/SIDIK-ML/issues"
Changelog = "https://github.com/radityobw/SIDIK-ML/blob/main/CHANGELOG.md"
Upstream = "https://github.com/radityobw/SIDIK"

[tool.setuptools.packages.find]
where = ["."]
include = ["sidik_ml*"]

[tool.setuptools.package-data]
"sidik_ml" = ["py.typed"]
"sidik_ml.data" = ["*.json"]
"sidik_ml.assets" = ["*.png", "*.ico"]

[tool.setuptools.dynamic]
version = {attr = "sidik_ml._version.__version__"}

[tool.pyrefly]
search-path = [".", "../SIDIK"]

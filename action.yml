name: "SIDIK-ML Hybrid Security Scanner (Non-ANN ML Triage)"
description: "Explainable Non-ANN ML False Positive Reduction + 5-manifest Offline OSV PyPI SCA powered by SIDIK."
author: "SIDIK Research Team - Universitas Sultan Ageng Tirtayasa"

branding:
  icon: "cpu"
  color: "orange"

inputs:
  target:
    description: "Target directory or file path to scan"
    required: false
    default: "."
  mode:
    description: "Scan mode: all, secret, or dep"
    required: false
    default: "all"
  severity:
    description: "Minimum severity level to report (low, medium, high, critical)"
    required: false
    default: "low"
  fail-on:
    description: "Severity threshold to fail workflow with exit code 1 (none, any, low, medium, high, critical)"
    required: false
    default: "high"
  lang:
    description: "Report language: id or en"
    required: false
    default: "en"
  model:
    description: "Optional path to verified .skops model artifact"
    required: false
    default: ""
  sha256:
    description: "Optional expected SHA-256 checksum for the .skops artifact"
    required: false
    default: ""
  threshold:
    description: "Probability threshold for Non-ANN ML triage (default: 0.5)"
    required: false
    default: "0.5"
  suppress-fp:
    description: "Suppress non-CRITICAL findings classified as false positives ('true' or 'false')"
    required: false
    default: "false"
  sarif-output:
    description: "Path to write SARIF v2.1.0 report for GitHub Code Scanning"
    required: false
    default: "sidik-ml-results.sarif"

outputs:
  sarif-file:
    description: "Generated SARIF v2.1.0 file path"
    value: ${{ inputs.sarif-output }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install SIDIK Core >=v1.3.2 and SIDIK-ML
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "git+https://github.com/radityobw/SIDIK.git@v1.3.2"
        pip install "${{ github.action_path }}"

    - name: Generate SARIF v2.1.0 Hybrid Report
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_SUPPRESS_FP: ${{ inputs.suppress-fp }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        args=(
          --target "$INPUT_TARGET"
          --mode "$INPUT_MODE"
          --severity "$INPUT_SEVERITY"
          --lang "$INPUT_LANG"
          --enable-ml
          --ml-threshold "$INPUT_THRESHOLD"
          --format sarif
          --output "$INPUT_SARIF_OUTPUT"
          --fail-on none
          --quiet
        )
        if [ -n "$INPUT_MODEL" ]; then
          args+=(--ml-model "$INPUT_MODEL")
        fi
        if [ -n "$INPUT_SHA256" ]; then
          args+=(--ml-sha256 "$INPUT_SHA256")
        fi
        if [ "$INPUT_SUPPRESS_FP" = "true" ]; then
          args+=(--ml-suppress-fp)
        fi
        python -m sidik.cli "${args[@]}"

    - name: Run SIDIK-ML Inline PR Annotations & Gate Check
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_SUPPRESS_FP: ${{ inputs.suppress-fp }}
      run: |
        args=(
          --target "$INPUT_TARGET"
          --mode "$INPUT_MODE"
          --severity "$INPUT_SEVERITY"
          --lang "$INPUT_LANG"
          --enable-ml
          --ml-threshold "$INPUT_THRESHOLD"
          --format github
          --fail-on "$INPUT_FAIL_ON"
          --quiet
        )
        if [ -n "$INPUT_MODEL" ]; then
          args+=(--ml-model "$INPUT_MODEL")
        fi
        if [ -n "$INPUT_SHA256" ]; then
          args+=(--ml-sha256 "$INPUT_SHA256")
        fi
        if [ "$INPUT_SUPPRESS_FP" = "true" ]; then
          args+=(--ml-suppress-fp)
        fi
        python -m sidik.cli "${args[@]}"
